<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ layout_direction }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ title }}</title>
	<meta name="generator" content="frappe">
	<style>
		
		.ql-ui { display: none; }

		/* counter dibuat di container utama */
		body { counter-reset: l0 l1 l2; }

		/* paragraf & heading mereset nomor, sama seperti di Quill */
		p, h1, h2, h3, h4, h5, h6 { counter-reset: l0 l1 l2; }

		/* ol TIDAK mereset counter, supaya nomor bisa lanjut melewati tabel */
		ol, ul { list-style: none; padding-left: 0; }

		li[data-list] {
		list-style: none;
		position: relative;
		padding-left: 1.5em;
		counter-reset: l1 l2;
		}
		li[data-list].ql-indent-1 { padding-left: 3.5em; counter-reset: l2; }
		li[data-list].ql-indent-2 { padding-left: 5.5em; counter-reset: none; }

		li[data-list]::before {
		position: absolute;
		width: 1.4em;
		margin-left: -1.6em;
		text-align: right;
		}

		li[data-list="ordered"]             { counter-increment: l0; }
		li[data-list="ordered"].ql-indent-1 { counter-increment: l1; }
		li[data-list="ordered"].ql-indent-2 { counter-increment: l2; }

		li[data-list="ordered"]::before             { content: counter(l0, decimal) "."; }
		li[data-list="ordered"].ql-indent-1::before { content: counter(l1, lower-alpha) "."; }
		li[data-list="ordered"].ql-indent-2::before { content: counter(l2, lower-roman) "."; }

		li[data-list="bullet"]::before { content: "\2022"; }

	{% if print_style %}
		{{ print_style }}
	{% endif %}
	</style>
</head>
<body>
	<div class="print-format-gutter">
		<div class="print-format">
			{{ body }}
		</div>
	</div>
</body>
</html>
